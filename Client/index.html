
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>OBVS Client Settings</title>
</head>
<body>
  <h1>OBVS Client Settings</h1>
  <form id="settings-form" novalidate>
    <p><label for="serverUrl">Server URL</label><br>
      <input id="serverUrl" type="text" placeholder="https://localhost:3000" required>
      <small id="serverUrl-error"></small></p>

    <p><label for="groupCode">Group code</label><br>
      <input id="groupCode" type="text" required>
      <small id="groupCode-error"></small></p>

    <p><label for="authKey">Auth key</label><br>
      <input id="authKey" type="password" autocomplete="off">
      <small id="authKey-error"></small><br><small id="key-hint"></small></p>

    <p><label for="displayName">Display name</label><br>
      <input id="displayName" type="text" required>
      <small id="displayName-error"></small></p>

    <button id="save" type="submit">Save settings</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="./dist/renderer.js" defer></script>
</body>
</html>
