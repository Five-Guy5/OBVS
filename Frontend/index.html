<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>OBVS Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }

      /* Fixed 1920×1080 transparent canvas for OBS browser sources. */
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }

      /* 5% title-safe inset: nothing on the Live page renders outside it. */
      .safe-area {
        position: absolute;
        inset: 54px 96px;
      }

      .header {
        text-align: center;
      }

      .team {
        position: absolute;
        bottom: 0;
      }

      .team-0 {
        left: 0;
      }

      .team-1 {
        right: 0;
      }

      .dead {
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
