<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">OBVS OBS overlay mockup</title>
  <desc id="desc">Mockup of the OBVS OBS browser-source overlay with team scores, round state, player panels, observed player, and economy. No live spike timer.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #0f172a; font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #475569; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; }
    .panel { fill: #0b1220; stroke: #334155; stroke-width: 2; }
    .team { fill: #f8fafc; font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; }
    .score { fill: #f8fafc; font-family: 'Segoe UI', Arial, sans-serif; font-size: 34px; font-weight: 700; }
    .round { fill: #94a3b8; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }
    .card { fill: #111c2e; stroke: #334155; stroke-width: 1; }
    .row { fill: #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; }
    .row-muted { fill: #94a3b8; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
    .observed { fill: #f8fafc; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .observed-sub { fill: #cbd5e1; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
    .caption { fill: #475569; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; }
    .tag { fill: #64748b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="700" rx="12"/>
  <text class="title" x="40" y="46">OBVS OBS overlay mockup</text>
  <text class="subtitle" x="40" y="72">Browser-source overlay for the tournament broadcast</text>

  <rect class="panel" x="50" y="100" width="1100" height="540" rx="14"/>

  <!-- Scoreboard -->
  <text class="team" x="250" y="156" text-anchor="middle">TEAM A</text>
  <text class="team" x="950" y="156" text-anchor="middle">TEAM B</text>
  <text class="score" x="600" y="166" text-anchor="middle">7 : 5</text>
  <text class="round" x="600" y="192" text-anchor="middle">ROUND 12 · COMBAT</text>
  <line x1="350" y1="210" x2="850" y2="210" stroke="#334155"/>

  <!-- Left team -->
  <rect class="card" x="80" y="235" width="310" height="250" rx="10"/>
  <text class="row" x="96" y="262">PLAYER 1 · JETT</text>
  <text class="row-muted" x="310" y="262">12 / 4 / 3</text>
  <text class="row" x="96" y="292">PLAYER 2 · SOVA</text>
  <text class="row-muted" x="310" y="292">8 / 6 / 5</text>
  <text class="row" x="96" y="322">PLAYER 3 · OMEN</text>
  <text class="row-muted" x="310" y="322">6 / 7 / 9</text>
  <text class="row" x="96" y="352">PLAYER 4 · CYPHER</text>
  <text class="row-muted" x="310" y="352">4 / 8 / 6</text>
  <text class="row" x="96" y="382">PLAYER 5 · RAZE</text>
  <text class="row-muted" x="310" y="382">9 / 5 / 2</text>
  <text class="row-muted" x="96" y="430">Credits shown per player in the live build.</text>
  <text class="row-muted" x="96" y="450">KDA shown here; economy is spectator-visible.</text>

  <!-- Right team -->
  <rect class="card" x="810" y="235" width="310" height="250" rx="10"/>
  <text class="row" x="826" y="262">PLAYER 6 · SOVA</text>
  <text class="row-muted" x="1040" y="262">7 / 5 / 4</text>
  <text class="row" x="826" y="292">PLAYER 7 · OMEN</text>
  <text class="row-muted" x="1040" y="292">5 / 7 / 6</text>
  <text class="row" x="826" y="322">PLAYER 8 · JETT</text>
  <text class="row-muted" x="1040" y="322">11 / 4 / 1</text>
  <text class="row" x="826" y="352">PLAYER 9 · RAZE</text>
  <text class="row-muted" x="1040" y="352">3 / 9 / 3</text>
  <text class="row" x="826" y="382">PLAYER 10 · CYPHER</text>
  <text class="row-muted" x="1040" y="382">4 / 8 / 5</text>
  <text class="row-muted" x="826" y="430">Live data only; no match history.</text>
  <text class="row-muted" x="826" y="450">No persistent player information.</text>

  <!-- Center -->
  <rect class="card" x="420" y="235" width="360" height="250" rx="10"/>
  <text class="team" x="600" y="275" text-anchor="middle" font-size="16">OBVS</text>
  <text class="row" x="600" y="308" text-anchor="middle">Live tournament overlay</text>
  <text class="row-muted" x="600" y="334" text-anchor="middle">Score · round · players · economy</text>
  <text class="row-muted" x="600" y="360" text-anchor="middle">OBS browser source</text>
  <text class="tag" x="600" y="420" text-anchor="middle">No live spike timer</text>
  <text class="tag" x="600" y="440" text-anchor="middle">No Riot API data</text>

  <!-- Observed player -->
  <rect class="card" x="80" y="510" width="360" height="100" rx="10"/>
  <text class="observed" x="96" y="540">OBSERVING: PLAYER 1 · JETT</text>
  <text class="observed-sub" x="96" y="566">Health 100 · Credits 3900 · Primary Vandal</text>
  <text class="observed-sub" x="96" y="588">Spectator-visible data only</text>

  <!-- Economy -->
  <rect class="card" x="760" y="510" width="360" height="100" rx="10"/>
  <text class="observed" x="776" y="540">TEAM ECONOMY</text>
  <text class="observed-sub" x="776" y="566">TEAM A: 18,400 · TEAM B: 15,900</text>
  <text class="observed-sub" x="776" y="588">Round 12 · Combat</text>

  <text class="caption" x="50" y="676">Mockup. The overlay renders spectator-visible data in OBS; it does not show a live spike timer.</text>
</svg>
